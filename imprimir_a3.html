<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Menú A3 – Xavi Petit</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e0e0e0;
      font-family: 'Lato', sans-serif;
      padding: 20px;
    }

    .print-btn {
      display: block;
      margin: 0 auto 20px;
      padding: 12px 40px;
      background: #4a5568;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .print-btn:hover { background: #2d3748; }

    .hoja {
      width: 297mm;
      height: 210mm;
      background: white;
      margin: 0 auto 20px;
      padding: 12mm 18mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      overflow: hidden;
      position: relative;
    }

    .watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1.8);
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: invert(1) grayscale(1);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    .hoja > *:not(.watermark) { position: relative; z-index: 1; }

    /* CABECERA */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
    }
    .logo-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: invert(1) grayscale(1);
      flex-shrink: 0;
    }
    .header-text h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 4rem;
      color: #1a1a1a;
      line-height: 1;
    }
    .header-text p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #555;
    }
    .fecha {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 600;
      color: #333;
      margin-left: auto;
    }

    /* SECCIONES */
    .section { width: 100%; }
    .section-title {
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #333;
      border-bottom: 0.5px solid #ccc;
      padding-bottom: 4px;
      margin-bottom: 8px;
    }
    .dishes {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .dish {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      color: #111;
      text-align: center;
      line-height: 1.7;
    }
    .dish-sup {
      font-family: 'Dancing Script', cursive;
      font-size: 1.8rem;
      color: #333;
      text-align: center;
      line-height: 1.7;
    }

    /* FOOTER */
    .footer {
      border-top: 0.5px solid #ccc;
      padding-top: 5px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .precio {
      font-family: 'Dancing Script', cursive;
      font-size: 2.6rem;
      font-weight: 700;
      color: #111;
    }
    .horario {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      color: #555;
      text-align: right;
      letter-spacing: 1px;
    }

    @media print {
      body { background: white; padding: 0; }
      .print-btn { display: none; }
      .hoja { box-shadow: none; margin: 0; page-break-after: always; }
      .hoja:last-child { page-break-after: avoid; }
      @page { size: A4 landscape; margin: 0; }
    }
  </style>
</head>

    <div class="section" id="sec-sups" style="display:none">
      <p class="section-title">Suplementos</p>
      <div class="dishes" id="sups"></div>
    </div>
    <div class="section" style="flex:1">
      <p class="section-title">Postres</p>
      <div class="dishes" id="postres"></div>
    </div>
    <div class="footer">
      <div class="precio" id="precio">—</div>
      <div class="horario">Cocina: 12:30 – 15:30<br>Tel. 93 237 88 26</div>
    </div>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTIRVQ4k35lO8VvV8pzRRPBv5Dqg1b7GrMRxFBxmtgOsk77L3fpL58VaXbY0yTEn6h63Yc810Ru2ji5/pub?output=csv';

    function parseCSV(text) {
      const es = {};
      function splitCSVLine(line) {
        const cols = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          if (line[i] === '"') { inQuotes = !inQuotes; }
          else if (line[i] === ',' && !inQuotes) { cols.push(current.trim()); current = ''; }
          else { current += line[i]; }
        }
        cols.push(current.trim());
        return cols;
      }
      text.split('\n').forEach(line => {
        const cols = splitCSVLine(line);
        if (cols.length >= 2) {
          const key = cols[0].replace(/"/g, '').trim();
          const val = cols[1].replace(/"/g, '').trim();
          if (key && val) es[key] = val;
        }
      });
      return es;
    }

    function dishes(keys, data) {
      return keys.map(k => data[k]).filter(Boolean)
        .map(p => `<p class="dish">${p}</p>`).join('');
    }

    fetch(CSV_URL)
      .then(r => r.text())
      .then(text => {
        const d = parseCSV(text);
        document.getElementById('fecha').textContent = d['fecha'] || '';
        document.getElementById('primeros').innerHTML = dishes(['primero1','primero2','primero3','primero4'], d);
        document.getElementById('segundos').innerHTML = dishes(['segundo1','segundo2','segundo3','segundo4'], d);
        document.getElementById('postres').innerHTML  = dishes(['postre1','postre2','postre3','postre4'], d);
        document.getElementById('precio').textContent = d['precio'] || '';

        const sups = [1,2,3].map(i => ({
          nombre: d['suplemento ' + i],
          precio: d['suplemento ' + i + ' precio']
        })).filter(s => s.nombre);

        if (sups.length > 0) {
          document.getElementById('sec-sups').style.display = 'block';
          document.getElementById('sups').innerHTML = sups
            .map(s => `<p class="dish-sup">${s.nombre}${s.precio ? ' · +' + s.precio + '€' : ''}</p>`).join('');
        }
      })
      .catch(() => {
        document.getElementById('primeros').innerHTML = '<p class="dish">Error al cargar el menú</p>';
      });
  </script>
